<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 560 260" width="560" height="260">
<title>A block in uniaxial tension made of two bodies with different element meshes, joined by a tie on the plane between them and held by symmetry rollers</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #16202b; stroke: #4f5966; stroke-width: 1.3;} svg.fig .mesh{stroke: #c5ccd5; stroke-width: 0.7; fill: none;} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #4a90e2; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #4a90e2;} svg.fig .dim{stroke: #82909e; stroke-width: 1;} svg.fig .m-dim{fill: #82909e;} svg.fig .m-def{fill: #cf6d2c;} svg.fig .deformed{stroke: #cf6d2c; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #82909e; font-size: 12px;} svg.fig .sym,svg.fig .axis-lbl{fill: #edf1f5; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .axis-lbl{fill: #82909e; font-size: 14px;} svg.fig .body,svg.fig .wall{stroke: #8fa3b5;} svg.fig .mesh{stroke: #2c3b4a;} svg.fig .hatch{stroke: #5f6d7a;}</style>
