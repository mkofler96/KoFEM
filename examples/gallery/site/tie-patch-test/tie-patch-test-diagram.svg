<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 600 250" width="600" height="250">
<title>Two blocks a small gap apart, tied across the gap, with symmetry supports on the left end and the bottom and a uniform tension σ on the right end</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #eef1f5; stroke: #4f5966; stroke-width: 1.3;} svg.fig .hole{fill: #ffffff; stroke: #4f5966; stroke-width: 1.3;} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #2563c9; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #2563c9;} svg.fig .dim{stroke: #6a717c; stroke-width: 1;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig .ext{stroke: #b5bcc6; stroke-width: 1;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .sym,svg.fig .axis-lbl{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .sub{font-size: 70%;} svg.fig .axis-lbl{fill: #6a717c; font-size: 14px;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
