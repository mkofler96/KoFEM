<style>@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.conv .grid{stroke: #e3e5e9; stroke-width: 1;} svg.conv .axis{stroke: #cfd3da; stroke-width: 1;} svg.conv .tick,svg.conv .axis-title{fill: #6a717c; font-size: 11px; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;} svg.conv .tol{stroke: #b7791f; stroke-width: 1; stroke-dasharray: 4 3;} svg.conv .tol-label{fill: #6a717c; font-size: 10.5px; font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.conv .ci-ring{fill: none; stroke: #16181d; stroke-width: 1.2;} svg.conv .line{fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;} svg.conv .line.s1{stroke: #2563c9;} svg.conv .mark{stroke-width: 2;} svg.conv .mark.over{fill: #ffffff;} svg.conv .mark.s1.over{stroke: #2563c9;} svg.conv .hit{fill: transparent;}</style>
