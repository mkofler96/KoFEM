<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig half" viewBox="0 0 360 240" width="360" height="240">
<title>Quarter of a thick elliptic plate, held on the faces x = 0 and y = 0 and on its outer face, with a pressure on its upper face; D lies on the upper face where the inner ellipse meets y = 0</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #eef1f5; stroke: #4f5966; stroke-width: 1.3;} svg.fig .hole{fill: #ffffff; stroke: #4f5966; stroke-width: 1.3;} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .m-load{fill: #2563c9;} svg.fig .dim{stroke: #6a717c; stroke-width: 1;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .axis-lbl{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .axis-lbl{fill: #6a717c; font-size: 14px;} svg.fig .pt{fill: #2563c9; stroke: #ffffff; stroke-width: 1.5;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
