<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig half" viewBox="0 0 330 150" width="330" height="150">
<title>The 30° cylindrical panel seen along its axis: clamped along AB, loaded by an edge moment m along DC; E is an interior point</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .clamp{fill: url(#hatch);} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .load{stroke: #2563c9; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #2563c9;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .sym{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .pt{fill: #2563c9; stroke: #ffffff; stroke-width: 1.5;} svg.fig .curve{stroke: #2563c9; stroke-width: 2; fill: none;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
    </defs>
    <path class="curve" d="M340.1 150.2A520 520 0 0 0 92.4 45.1"/>
    <rect class="clamp" x="334.1" y="143.2" width="18" height="14"/>
    <path class="load" d="M112.4 51.1A16 16 0 1 0 80.4 33.1" marker-end="url(#arr-load)" fill="none"/>
    <text class="sym" x="62.4" y="31.1" text-anchor="end">𝑚</text>
    <text class="lbl" x="358.1" y="154.2" text-anchor="start">A, B (clamped)</text>
    <text class="lbl" x="86.4" y="67.1" text-anchor="end">D, C</text>
    <circle class="pt" cx="180.7" cy="65.5" r="3.5"/>
    <text class="lbl" x="188.7" y="59.5" text-anchor="start">E</text>
