<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 640 260" width="640" height="260">
<title>Cook's membrane: a tapered panel clamped on its left edge with a uniform shear load F on its right edge; M, the middle of the loaded edge, is where the deflection is measured, C the top-right corner</title>
<style>@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #16202b; stroke: #4f5966; stroke-width: 1.3;} svg.fig .clamp{fill: url(#hatch);} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #4a90e2; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #4a90e2;} svg.fig .dim{stroke: #82909e; stroke-width: 1;} svg.fig .m-dim{fill: #82909e;} svg.fig .m-def{fill: #cf6d2c;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #82909e; font-size: 12px;} svg.fig .sym,svg.fig .axis-lbl{fill: #edf1f5; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .axis-lbl{fill: #82909e; font-size: 14px;} svg.fig .coord{fill: #82909e; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-size: 10.5px;} svg.fig .pt{fill: #4a90e2; stroke: #0c1015; stroke-width: 1.5;} svg.fig .body,svg.fig .wall{stroke: #8fa3b5;} svg.fig .hatch{stroke: #5f6d7a;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
