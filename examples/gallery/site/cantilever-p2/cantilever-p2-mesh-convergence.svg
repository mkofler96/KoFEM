            <path class="line s1" d="M59.3 52.4 L139.5 80.8 L232.5 115.1 L334.6 152.7"/><g><title>P1 (linear), 10 × 1 × 1: 132 DOFs, difference −35.22 %</title><circle class="hit" cx="59.3" cy="52.4" r="10"/><circle class="mark s1 under" cx="59.3" cy="52.4" r="4.5"/></g><g><title>P1 (linear), 20 × 2 × 2: 567 DOFs, difference −12.42 %</title><circle class="hit" cx="139.5" cy="80.8" r="10"/><circle class="mark s1 under" cx="139.5" cy="80.8" r="4.5"/></g><g><title>P1 (linear), 40 × 4 × 4: 3,075 DOFs, difference −3.51 % (the example's mesh)</title><circle class="hit" cx="232.5" cy="115.1" r="10"/><circle class="mark s1 under" cx="232.5" cy="115.1" r="4.5"/><circle class="ci-ring" cx="232.5" cy="115.1" r="9"/></g><g><title>P1 (linear), 80 × 8 × 8: 19,683 DOFs, difference −0.88 %</title><circle class="hit" cx="334.6" cy="152.7" r="10"/><circle class="mark s1 under" cx="334.6" cy="152.7" r="4.5"/></g><path class="line s2" d="M103.9 147.9 L195.7 132.7 L297.1 138.6"/><g><title>P2 (quadratic), 5 × 1 × 1: 297 DOFs, difference −1.05 %</title><circle class="hit" cx="103.9" cy="147.9" r="10"/><circle class="mark s2 under" cx="103.9" cy="147.9" r="4.5"/></g><g><title>P2 (quadratic), 10 × 2 × 2: 1,575 DOFs, difference +1.84 % (the example's mesh)</title><circle class="hit" cx="195.7" cy="132.7" r="10"/><circle class="mark s2 over" cx="195.7" cy="132.7" r="4.5"/><circle class="ci-ring" cx="195.7" cy="132.7" r="9"/></g><g><title>P2 (quadratic), 20 × 4 × 4: 9,963 DOFs, difference +1.48 %</title><circle class="hit" cx="297.1" cy="138.6" r="10"/><circle class="mark s2 over" cx="297.1" cy="138.6" r="4.5"/></g>
