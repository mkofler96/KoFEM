            <path class="line s1" d="M136.4 50.4 L180.5 62.9 L261.1 90.5 L317.5 112.1"/><g><title>P1 (linear), 50 mm: 939 DOFs, difference −27.46 %</title><circle class="hit" cx="136.4" cy="50.4" r="10"/><circle class="mark s1 under" cx="136.4" cy="50.4" r="4.5"/></g><g><title>P1 (linear), 25 mm: 2,733 DOFs, difference −14.85 %</title><circle class="hit" cx="180.5" cy="62.9" r="10"/><circle class="mark s1 under" cx="180.5" cy="62.9" r="4.5"/></g><g><title>P1 (linear), 12.5 mm: 19,269 DOFs, difference −3.86 % (the example's mesh)</title><circle class="hit" cx="261.1" cy="90.5" r="10"/><circle class="mark s1 under" cx="261.1" cy="90.5" r="4.5"/><circle class="ci-ring" cx="261.1" cy="90.5" r="9"/></g><g><title>P1 (linear), 8 mm: 75,624 DOFs, difference −1.34 %</title><circle class="hit" cx="317.5" cy="112.1" r="10"/><circle class="mark s1 under" cx="317.5" cy="112.1" r="4.5"/></g><path class="line s2" d="M212.3 140.6 L254.9 184.4 L340.8 177.6"/><g><title>P2 (quadratic), 50 mm: 5,904 DOFs, difference −0.33 % (the example's mesh)</title><circle class="hit" cx="212.3" cy="140.6" r="10"/><circle class="mark s2 under" cx="212.3" cy="140.6" r="4.5"/><circle class="ci-ring" cx="212.3" cy="140.6" r="9"/></g><g><title>P2 (quadratic), 25 mm: 16,596 DOFs, difference −0.04 %</title><circle class="hit" cx="254.9" cy="184.4" r="10"/><circle class="mark s2 under" cx="254.9" cy="184.4" r="4.5"/></g><g><title>P2 (quadratic), 12.5 mm: 133,131 DOFs, difference +0.05 %</title><circle class="hit" cx="340.8" cy="177.6" r="10"/><circle class="mark s2 over" cx="340.8" cy="177.6" r="4.5"/></g>
