<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #eef1f5; stroke: #4f5966; stroke-width: 1.3;} svg.fig .clamp{fill: url(#hatch);} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #2563c9; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #2563c9;} svg.fig .dim{stroke: #6a717c; stroke-width: 1;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .sym{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .pt{fill: #2563c9; stroke: #ffffff; stroke-width: 1.5;}</style>
