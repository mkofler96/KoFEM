<title>Pinched cylinder, curved shell triangles: difference from the reference against degrees of freedom, logarithmic axes</title>
<style>@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.conv .grid{stroke: #1f2a35; stroke-width: 1;} svg.conv .axis{stroke: #36424e; stroke-width: 1;} svg.conv .tick,svg.conv .axis-title{fill: #82909e; font-size: 11px; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;} svg.conv .tol{stroke: #e5c07b; stroke-width: 1; stroke-dasharray: 4 3;} svg.conv .tol-label{fill: #82909e; font-size: 10.5px; font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.conv .ci-ring{fill: none; stroke: #edf1f5; stroke-width: 1.2;} svg.conv .line{fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;} svg.conv .line.s1{stroke: #4a90e2;} svg.conv .mark{stroke-width: 2;} svg.conv .mark.s1.under{fill: #4a90e2; stroke: #0c1015;} svg.conv .mark.over{fill: #0c1015;} svg.conv .mark.s1.over{stroke: #4a90e2;} svg.conv .hit{fill: transparent;}</style>
