<title>Axial bar, P1 vs. P2: discretisation error against element size, logarithmic axes, with the expected slopes dashed</title>
<style>@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.conv .grid{stroke: #e3e5e9; stroke-width: 1;} svg.conv .axis{stroke: #cfd3da; stroke-width: 1;} svg.conv .tick,svg.conv .axis-title{fill: #6a717c; font-size: 11px; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;} svg.conv .line{fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;} svg.conv .line.s1{stroke: #2563c9;} svg.conv .line.s2{stroke: #c4561f;} svg.conv .mark{stroke-width: 2;} svg.conv .mark.s1.under{fill: #2563c9; stroke: #ffffff;} svg.conv .mark.s2.under{fill: #c4561f; stroke: #ffffff;} svg.conv .hit{fill: transparent;} svg.conv .slope{stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.8;} svg.conv .slope.s1{stroke: #2563c9;} svg.conv .slope.s2{stroke: #c4561f;}</style>
