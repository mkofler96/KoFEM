<title>The Z cross-section: a horizontal web and two flanges running to opposite sides, each end flange loaded by a shear S; A sits on the free edge of the lower flange</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #16202b; stroke: #4f5966; stroke-width: 1.3;} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .load{stroke: #4a90e2; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #4a90e2;} svg.fig .m-dim{fill: #82909e;} svg.fig .m-def{fill: #cf6d2c;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #82909e; font-size: 12px;} svg.fig .sym{fill: #edf1f5; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .pt{fill: #4a90e2; stroke: #0c1015; stroke-width: 1.5;} svg.fig .body{stroke: #8fa3b5;} svg.fig .hatch{stroke: #5f6d7a;}</style>
