<title>The Scordelis–Lo roof seen along its axis: an arc of radius R spanning φ = 40° each side of the crown, free along both straight edges, loaded by its weight q; A is the middle of a free edge</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .load{stroke: #2563c9; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #2563c9;} svg.fig .dim{stroke: #6a717c; stroke-width: 1;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig .ext{stroke: #b5bcc6; stroke-width: 1;} svg.fig .axis{stroke: #9aa2ad; stroke-width: 1; stroke-dasharray: 8 3 2 3;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .sym{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .pt{fill: #2563c9; stroke: #ffffff; stroke-width: 1.5;} svg.fig .curve{stroke: #2563c9; stroke-width: 2; fill: none;}</style>
