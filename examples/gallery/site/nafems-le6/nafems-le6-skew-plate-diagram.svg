<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig half" viewBox="0 0 330 170" width="330" height="170">
<title>The 30° skew plate ABCD with 1 m sides, simply supported on every edge under a uniform pressure; E is its centre</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #eef1f5; stroke: #4f5966; stroke-width: 1.3;} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .m-load{fill: #2563c9;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .pt{fill: #2563c9; stroke: #ffffff; stroke-width: 1.5;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
    </defs>
    <polygon class="body" points="30,120 160,120 272.6,55 142.6,55"/>
    <circle class="pt" cx="151.3" cy="87.5" r="3.5"/>
    <text class="lbl" x="26" y="136" text-anchor="middle">A</text>
    <text class="lbl" x="160" y="136" text-anchor="middle">B</text>
    <text class="lbl" x="278.6" y="51" text-anchor="start">C</text>
    <text class="lbl" x="136.6" y="49" text-anchor="end">D</text>
    <text class="lbl" x="159.3" y="81.5" text-anchor="start">E</text>
    <text class="lbl" x="30" y="156" text-anchor="start">simply supported on all edges; uniform pressure</text>
</svg>
