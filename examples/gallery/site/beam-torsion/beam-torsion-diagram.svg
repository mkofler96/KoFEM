<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 640 230" width="640" height="230">
<title>Square bar clamped at the left end and twisted by a torque at the right end; inset shows the sign of the out-of-plane warping over the section</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400 600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #eef1f5; stroke: #4f5966; stroke-width: 1.3;} svg.fig .body.top{fill: #e3e8ee;} svg.fig .body.end{fill: #d9dfe7;} svg.fig .mesh{stroke: #c5ccd5; stroke-width: 0.7; fill: none;} svg.fig .clamp{fill: url(#hatch);} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #2563c9; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #2563c9;} svg.fig .dim{stroke: #6a717c; stroke-width: 1;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig .axis{stroke: #9aa2ad; stroke-width: 1; stroke-dasharray: 8 3 2 3;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .sym,svg.fig .axis-lbl{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .axis-lbl{fill: #6a717c; font-size: 14px;} svg.fig .warp{fill: #2563c9; font-size: 17px; font-weight: 600;}</style>
