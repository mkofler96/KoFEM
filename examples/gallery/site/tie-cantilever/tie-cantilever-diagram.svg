<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 560 214" width="560" height="214">
<title>Cantilever beam cut at mid-span into two bodies a small gap apart and tied across the gap, clamped at the left end with a downward tip load</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #eef1f5; stroke: #4f5966; stroke-width: 1.3;} svg.fig .clamp{fill: url(#hatch);} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #2563c9; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #2563c9;} svg.fig .dim{stroke: #6a717c; stroke-width: 1;} svg.fig .m-dim{fill: #6a717c;} svg.fig .m-def{fill: #c4561f;} svg.fig .ext{stroke: #b5bcc6; stroke-width: 1;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #6a717c; font-size: 12px;} svg.fig .sym,svg.fig .axis-lbl{fill: #16181d; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .axis-lbl{fill: #6a717c; font-size: 14px;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
    </defs>
    <rect class="body" x="90" y="73" width="190" height="38"/>
    <rect class="body" x="296" y="73" width="190" height="38"/>
    <rect class="clamp" x="76" y="67" width="14" height="50"/><line class="wall" x1="90" y1="67" x2="90" y2="117"/>
    <line class="ext" x1="280" y1="79" x2="296" y2="79"/><line class="ext" x1="280" y1="92" x2="296" y2="92"/><line class="ext" x1="280" y1="105" x2="296" y2="105"/>
    <line class="load" x1="486" y1="21" x2="486" y2="71" marker-end="url(#arr-load)"/>
    <text class="sym" x="496" y="39" text-anchor="start">𝑃</text>
    <text class="lbl" x="288" y="63" text-anchor="middle">tie</text>
    <line class="dim" x1="90" y1="145" x2="486" y2="145" marker-start="url(#arr-dim-start)" marker-end="url(#arr-dim)"/>
    <text class="sym" x="288" y="139" text-anchor="middle">𝐿 + 𝑔</text>
    <line class="dim" x1="30" y1="196" x2="56" y2="196" marker-end="url(#arr-dim)"/><line class="dim" x1="30" y1="196" x2="30" y2="170" marker-end="url(#arr-dim)"/><text class="axis-lbl" x="62" y="200" text-anchor="start">𝑥</text><text class="axis-lbl" x="30" y="164" text-anchor="middle">𝑦</text>
</svg>
