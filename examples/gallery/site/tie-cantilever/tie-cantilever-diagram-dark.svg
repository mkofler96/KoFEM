<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 560 240" width="560" height="240">
<title>Cantilever beam cut at mid-span into two bodies with different element meshes, tied across the cut, clamped at the left end with a downward tip load</title>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}svg.fig .body{fill: #16202b; stroke: #4f5966; stroke-width: 1.3;} svg.fig .mesh{stroke: #c5ccd5; stroke-width: 0.7; fill: none;} svg.fig .clamp{fill: url(#hatch);} svg.fig .hatch{stroke: #7d8693; stroke-width: 1.1;} svg.fig .wall{stroke: #4f5966; stroke-width: 2;} svg.fig .load{stroke: #4a90e2; stroke-width: 1.7; fill: none;} svg.fig .m-load{fill: #4a90e2;} svg.fig .dim{stroke: #82909e; stroke-width: 1;} svg.fig .m-dim{fill: #82909e;} svg.fig .m-def{fill: #cf6d2c;} svg.fig .deformed{stroke: #cf6d2c; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none;} svg.fig text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;} svg.fig .lbl{fill: #82909e; font-size: 12px;} svg.fig .sym,svg.fig .axis-lbl{fill: #edf1f5; font-family: "KoFEM Math", math; font-size: 17px;} svg.fig .axis-lbl{fill: #82909e; font-size: 14px;} svg.fig .body,svg.fig .wall{stroke: #8fa3b5;} svg.fig .mesh{stroke: #2c3b4a;} svg.fig .hatch{stroke: #5f6d7a;}</style>
<defs>
      <marker id="arr-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="m-load"/></marker><marker id="arr-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" class="m-load"/></g></marker>
      <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-dim"/></marker><marker id="arr-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-dim"/></g></marker>
      <marker id="arr-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" class="m-def"/></marker><marker id="arr-def-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 1L10 5L0 9z" class="m-def"/></g></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
    </defs>
    <rect class="body" x="90" y="70" width="380" height="44"/>
    <line class="mesh" x1="128" y1="70" x2="128" y2="114"/><line class="mesh" x1="166" y1="70" x2="166" y2="114"/><line class="mesh" x1="204" y1="70" x2="204" y2="114"/><line class="mesh" x1="242" y1="70" x2="242" y2="114"/><line class="mesh" x1="90" y1="92" x2="280" y2="92"/>
    <line class="mesh" x1="318" y1="70" x2="318" y2="114"/><line class="mesh" x1="356" y1="70" x2="356" y2="114"/><line class="mesh" x1="394" y1="70" x2="394" y2="114"/><line class="mesh" x1="432" y1="70" x2="432" y2="114"/><line class="mesh" x1="280" y1="84.7" x2="470" y2="84.7"/><line class="mesh" x1="280" y1="99.3" x2="470" y2="99.3"/>
    <line class="deformed" x1="280" y1="56" x2="280" y2="128"/>
    <text class="lbl" x="280" y="144" text-anchor="middle">tie</text>
    <rect class="clamp" x="76" y="64" width="14" height="56"/><line class="wall" x1="90" y1="64" x2="90" y2="120"/>
    <line class="load" x1="470" y1="18" x2="470" y2="68" marker-end="url(#arr-load)"/>
    <text class="sym" x="480" y="36" text-anchor="start">𝑃</text>
    <line class="dim" x1="90" y1="166" x2="470" y2="166" marker-start="url(#arr-dim-start)" marker-end="url(#arr-dim)"/>
    <text class="sym" x="280" y="160" text-anchor="middle">𝐿</text>
    <line class="dim" x1="30" y1="220" x2="56" y2="220" marker-end="url(#arr-dim)"/><line class="dim" x1="30" y1="220" x2="30" y2="194" marker-end="url(#arr-dim)"/><text class="axis-lbl" x="62" y="224" text-anchor="start">𝑥</text><text class="axis-lbl" x="30" y="188" text-anchor="middle">𝑦</text>
</svg>
