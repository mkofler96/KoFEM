name: Set up Playwright Chromium
description: Cache and install the headless Chromium that the Playwright version pins

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: version
      shell: bash
      working-directory: web
      run: echo "version=$(bun -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-headless

    # No `--with-deps`: the hosted runner image already has every library
    # Chromium links, so that flag only installed fallback fonts for scripts
    # the app does not use, through an `apt-get update` that stalled for
    # minutes on bad days and failed whole runs. The installer checks the
    # browser revision itself, so a cache hit downloads nothing. If a future
    # runner image lacks a library, Chromium names it when it fails to launch.
    - name: Install headless Chromium
      shell: bash
      working-directory: web
      run: bunx playwright install --only-shell chromium
