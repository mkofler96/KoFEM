name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The product version, from web/package.json — also checks that Cargo.toml and
  # CHANGELOG.md agree with it, so a half-done release PR fails here.
  version:
    name: Release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "version=$(bash scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (native)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Pinned by commit, so the toolchain can no longer come from the ref.
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-rust

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  native-tests:
    name: C++ numerical tests (native)
    runs-on: ubuntu-24.04
    env:
      CXX: g++

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boundary condition validation
        run: bash scripts/test-bc-validation.sh

      - name: Shell element validation
        run: bash scripts/test-shell.sh

      - name: Topology filter validation
        run: bash scripts/test-topology-filter.sh

      - name: MMA optimizer validation
        run: bash scripts/test-topology-mma.sh

      - name: Shell and coupled topology validation
        run: bash scripts/test-topology-shell.sh

  # These harnesses link the precompiled MFEM WASM library, so they need em++
  # and node from the dependency image. Run independently of the engine build:
  # a cached or published engine must never bypass numerical regression tests.
  wasm-tests:
    name: C++ numerical tests (MFEM/WASM)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mkofler96/kofem-dependencies:0.0.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SIMP core validation
        run: bash scripts/test-topology.sh

      - name: Topology optimization loop validation
        run: bash scripts/test-topology-optimize.sh

      - name: Stress-constrained topology validation
        run: bash scripts/test-topology-stress.sh

      - name: Level-set topology validation
        run: bash scripts/test-topology-levelset.sh

  clang-tidy:
    name: C++ clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fetch-wasm-deps.sh writes to /emsdk and /opt/kofem-deps (the image's
      # baked-in paths); pre-own them so the non-root fetch and the cache
      # restore/save can both write there.
      - name: Prepare toolchain dirs
        run: sudo mkdir -p /emsdk /opt/kofem-deps && sudo chown -R "$USER" /emsdk /opt/kofem-deps

      - name: Cache WASM toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /emsdk
            /opt/kofem-deps
          key: wasm-toolchain-${{ runner.os }}-deps0.0.2

      # Idempotent: exits immediately on a cache hit (checks .kofem-deps-tag).
      - name: Fetch WASM deps
        run: bash scripts/fetch-wasm-deps.sh

      # clang-tidy >= 20 is required to parse the emsdk clang-22-era headers;
      # ninja-build is needed by the emcmake configure that emits
      # compile_commands.json (see scripts/clang-tidy.sh).
      - name: Install clang-tidy-20
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror stalled LLVM downloads for >16 minutes.
          # Use the main Ubuntu archive for this install, without changing the
          # runner's sources or pulling LLVM's recommended development packages.
          cat > "$RUNNER_TEMP/clang-tidy.sources" <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          APT_OPTIONS=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/clang-tidy.sources"
            -o "Dir::Etc::sourceparts=-"
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${APT_OPTIONS[@]}" update
          sudo apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends clang-tidy-20 ninja-build

      - name: clang-tidy
        run: bash scripts/clang-tidy.sh

  # The compiled engine is not committed (KOF-186) — it is published as the
  # release `engine-<id>` and pulled in by scripts/fetch-wasm-engine.sh. The ID is
  # a content hash of the engine sources, computed here on the runner rather than
  # in the `wasm` job: that job runs inside the dependency container, which may
  # have no git metadata to hash.
  engine-id:
    name: Engine build ID
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.compute.outputs.id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: compute
        run: |
          ID="$(bash scripts/engine-version.sh)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Engine build ID: $ID"

  wasm:
    name: WASM (Emscripten)
    needs: [engine-id]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mkofler96/kofem-dependencies:0.0.2

    env:
      KOFEM_ENGINE_ID: ${{ needs.engine-id.outputs.id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CMake stores absolute EMSDK paths in CMakeCache.txt and breaks across runs
      - name: Cache WASM build output
        id: wasm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/src/wasm/pkg/kofem_wasm_emcc.js
            web/src/wasm/pkg/kofem_wasm_emcc.wasm
            web/src/wasm/pkg/.engine-id
          key: wasm-${{ runner.os }}-${{ needs.engine-id.outputs.id }}

      # On a cache miss the engine may still have been built before — every push
      # to main publishes one. Downloading it beats a 20-minute rebuild, and it
      # exercises the exact path contributors use.
      - name: Try the published engine release
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-wasm-engine.sh --optional

      - name: Engine source status
        id: engine
        run: |
          if [ -s web/src/wasm/pkg/kofem_wasm_emcc.wasm ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Engine ${KOFEM_ENGINE_ID} obtained without building."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Engine ${KOFEM_ENGINE_ID} not published yet — full build will run."
          fi

      - name: Clean stale CMake cache
        if: steps.engine.outputs.have != 'true'
        run: |
          rm -f target/wasm-build/CMakeCache.txt
          rm -rf target/wasm-build/CMakeFiles

      - name: Build WASM engine
        if: steps.engine.outputs.have != 'true'
        run: bash scripts/build-wasm.sh

      # include-hidden-files carries the .engine-id stamp through to the jobs that
      # download this, so they can tell which sources the binary came from.
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kofem-wasm-pkg
          retention-days: 7
          include-hidden-files: true
          path: |
            web/src/wasm/pkg/kofem_wasm_emcc.js
            web/src/wasm/pkg/kofem_wasm_emcc.wasm
            web/src/wasm/pkg/.engine-id

  # Publish the engine so contributors, the Docker build and future CI runs can
  # download it instead of committing a ~34 MB blob per engine change (KOF-186).
  # Only from main and develop: a release is a public, immutable artifact, and PR
  # branches are served by the workflow artifact above. Releases are keyed by a
  # hash of the engine sources, so one published from develop is exactly the one
  # main would publish — main finds it and has nothing to do.
  publish-engine:
    name: Publish engine release
    needs: [engine-id, wasm, native-tests, wasm-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: engine-dist/

      # Releases are content-addressed, so an existing tag already holds a binary
      # built from these exact sources — re-uploading would only churn it.
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.engine-id.outputs.id }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published — nothing to do."
            exit 0
          fi

          cd engine-dist
          sha256sum kofem_wasm_emcc.js kofem_wasm_emcc.wasm > SHA256SUMS

          # Marked as a prerelease so these build artifacts never take over the
          # "Latest release" banner from an actual product release.
          if gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WASM engine $TAG" \
            --prerelease \
            --notes "Compiled KoFEM WASM engine, built from \`engine/\` at ${GITHUB_SHA}.

          Installed automatically by \`scripts/fetch-wasm-engine.sh\`, which resolves this
          tag from the engine sources in your checkout — you should not need to download
          these files by hand." \
            kofem_wasm_emcc.js kofem_wasm_emcc.wasm SHA256SUMS; then
            exit 0
          fi

          # Two pushes carrying the same engine sources can race here. Losing the
          # race is fine — the winner published a binary built from those same
          # sources. Anything else is a real failure.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG was published concurrently — nothing to do."
            exit 0
          fi
          echo "ERROR: publishing $TAG failed and no release exists." >&2
          exit 1

  # --- Web frontend ---------------------------------------------------------
  # The web gates run as parallel jobs: the static checks, the validation
  # scripts, the Playwright suite split into shards, and the production-image
  # smoke test. Coverage is merged from the shards afterwards, and an image is
  # only published once every one of them has passed.

  web-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    needs: [wasm]

    env:
      # These jobs take the engine from the `wasm` job's artifact, so the
      # package.json pre-hooks must not try to fetch a release on top of it —
      # a PR that changes engine/ has no published release yet.
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: web/src/wasm/pkg/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Typecheck
        run: cd web && bun run typecheck

      - name: Lint
        run: cd web && bun run lint

      - name: Format
        run: cd web && bun run format:check

      - name: Build frontend
        run: cd web && bun run build

  # The engine-level validation benchmarks and the node-side checks
  # (tests/test_*.mjs) — no browser, so they run beside the Playwright shards.
  validation:
    name: Validation scripts
    runs-on: ubuntu-24.04
    needs: [wasm]

    env:
      # These jobs take the engine from the `wasm` job's artifact, so the
      # package.json pre-hooks must not try to fetch a release on top of it —
      # a PR that changes engine/ has no published release yet.
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: web/src/wasm/pkg/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Run validation scripts
        run: cd web && bun run test:validation

  # The Playwright suite, split across parallel jobs (`--shard`). Code changes
  # collect coverage for the aggregate job; Dependabot PRs run the same tests
  # without coverage instrumentation or reporting.
  e2e:
    name: Playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: [wasm]

    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      # These jobs take the engine from the `wasm` job's artifact, so the
      # package.json pre-hooks must not try to fetch a release on top of it —
      # a PR that changes engine/ has no published release yet.
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: web/src/wasm/pkg/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5

      - name: Run Playwright shard
        run: cd web && bunx playwright test --shard=${{ matrix.shard }}/4
        env:
          # Use the PR author so a maintainer's rerun or follow-up commit keeps
          # the dependency-update policy. Vite disables Istanbul on an empty value.
          COVERAGE: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && '1' || '' }}

      # `if: always()`: a failing shard still hands over the coverage it gathered.
      - name: Upload coverage counters
        if: ${{ always() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: web/.nyc_output/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

      # Failure screenshots stay in the run that produced them. They used to be
      # pushed to a chat channel on every run, which buried the signal; anyone
      # investigating a red build downloads them from here instead.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: web/playwright-results/
          retention-days: 3
          if-no-files-found: ignore

  # Prints per-file coverage and flags src files never loaded by any test
  # (dead-code candidates), from all shards together. Runs even when a shard
  # failed, on the coverage gathered up to that point. Dependency updates are
  # gated by tests and smoke tests, without a coverage job or external upload.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: [e2e]
    if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Collect coverage from the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: web/.nyc_output/

      - name: Coverage report
        run: cd web && bun run coverage:report

      - name: Report coverage to DeepSource
        run: |
          curl -sSf https://deepsource.io/cli | sh
          sed 's|^SF:|SF:web/|' web/coverage/lcov.info > web/coverage/lcov.deepsource.info
          ./bin/deepsource report --analyzer test-coverage --key javascript \
            --value-file web/coverage/lcov.deepsource.info
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}

      # CI does not publish the workflow showcase. That is a weekly Claude task
      # (.claude/skills/showcase) posting to Linear over MCP, so no Linear
      # credential exists in this repository.

  # Build the real production image and smoke-test it, in parallel with the
  # tests. The image is built map-free in main mode by web/Dockerfile.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [wasm, version]

    env:
      # These jobs take the engine from the `wasm` job's artifact, so the
      # package.json pre-hooks must not try to fetch a release on top of it —
      # a PR that changes engine/ has no published release yet.
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: web/src/wasm/pkg/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the real production image, run it, and drive the full WASM pipeline
      # through the served artifacts. This catches production-only breakage (e.g.
      # a fingerprinted asset or the .wasm binary failing to resolve) that the
      # dev server and dist preview cannot. publish-image only runs once this
      # passed, and builds with the same inputs, so it pushes these layers from
      # the gha cache.
      - name: Smoke-test production image
        run: |
          VERSION=v${{ needs.version.outputs.version }}-$(git rev-parse --short HEAD)
          # Same stamp as publish-image, so its build is all cache hits.
          if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then VERSION="${VERSION/-/-dev-}"; fi
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --file ./web/Dockerfile \
            --build-context gallery=./examples/gallery/site \
            --build-arg VITE_GIT_VERSION=${VERSION} \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --tag kofem-web:smoke \
            ./web
          docker run -d --name kofem-smoke -p 10000:10000 kofem-web:smoke
          for i in $(seq 1 60); do
            curl -sf http://localhost:10000/ >/dev/null && break
            sleep 1
          done
          cd web && SMOKE_BASE_URL=http://localhost:10000 \
            bunx playwright test -c playwright.docker.config.ts

      # The same image as the dev deployment runs it (KOFEM_CHANNEL=dev): kept out
      # of search engines and marked, and an unknown channel refuses to start.
      - name: Smoke-test dev channel
        run: |
          docker run -d --name kofem-smoke-dev -e KOFEM_CHANNEL=dev -p 10001:10000 kofem-web:smoke
          for i in $(seq 1 60); do
            curl -sf http://localhost:10001/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:10001/robots.txt | grep -qx 'Disallow: /'
          curl -sf http://localhost:10001/app/ | grep -q '<meta name="kofem-channel" content="dev">'
          curl -sf http://localhost:10001/ | grep -q '<meta name="robots" content="noindex, nofollow">'
          set +e
          timeout 30 docker run --rm -e KOFEM_CHANNEL=prod kofem-web:smoke
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "ERROR: an unknown KOFEM_CHANNEL must stop the container (exit $status)" >&2
            exit 1
          fi

      - name: Tear down smoke container
        if: always()
        run: docker rm -f kofem-smoke kofem-smoke-dev || true


  # Publish the image: main = :latest, develop = :dev; nothing for any other
  # branch or PR. Only after every gate passed on this commit, so a broken
  # commit never ships an image. The smoke test's build left its layers in the
  # gha cache, so this build is mostly cache hits.
  publish-image:
    name: Publish image
    runs-on: ubuntu-24.04
    needs: [version, native-tests, wasm-tests, web-checks, validation, e2e, coverage, image]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write
      # Signed build provenance for pushed images (GitHub OIDC), so a deployment
      # can verify an image before running it.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: web/src/wasm/pkg/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/kofem-web"
          # The status bar shows this, so a bug report names the exact commit.
          VERSION=v${{ needs.version.outputs.version }}-$(git rev-parse --short HEAD)

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "main build: pushing :latest"
            PUSH_FLAG="--push"
            TAG_ARGS="--tag ${IMAGE}:latest --tag ${IMAGE}:${VERSION}"
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            VERSION="${VERSION/-/-dev-}"
            echo "develop build: pushing :dev"
            PUSH_FLAG="--push"
            TAG_ARGS="--tag ${IMAGE}:dev --tag ${IMAGE}:${VERSION}"
          else
            echo "ERROR: publish-image runs only for main and develop, not ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

          docker buildx build \
            --platform linux/amd64 \
            --file ./web/Dockerfile \
            --build-context gallery=./examples/gallery/site \
            --build-arg VITE_GIT_VERSION=${VERSION} \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            $TAG_ARGS \
            $PUSH_FLAG \
            ./web

          if [ -n "$PUSH_FLAG" ]; then
            DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
            case "$DIGEST" in
              sha256:*) echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT" ;;
              *) echo "ERROR: buildx reported no image digest ('$DIGEST')" >&2; exit 1 ;;
            esac
          fi

      # Signed provenance (SLSA, via GitHub OIDC) stored next to the image in
      # GHCR. A deployment that verifies it only runs images this workflow built
      # from this repository and branch — an image pushed to the registry any
      # other way fails the check:
      #   gh attestation verify oci://ghcr.io/mkofler96/kofem-web@<digest> \
      #     --repo mkofler96/KoFEM --signer-workflow mkofler96/KoFEM/.github/workflows/ci.yml \
      #     --source-ref refs/heads/develop --deny-self-hosted-runners
      - name: Attest web image provenance
        if: steps.image.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Tag and publish vX.Y.Z from the release commit: the merged release PR, which
  # is the maintainer's go/no-go. This job only runs after every gate passed on
  # that exact commit; scripts/publish-release.sh makes every other commit's run
  # a no-op, so a later push to main can never take the tag.
  release:
    name: Publish product release
    needs: [rust, clang-tidy, native-tests, wasm-tests, web-checks, validation, e2e, coverage, image, publish-image, publish-engine]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the script finds the commit that added the version's
          # CHANGELOG.md heading.
          fetch-depth: 0

      - name: Publish release if this is the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
