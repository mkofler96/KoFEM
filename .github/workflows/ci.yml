name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to a pull request replaces the run in progress. Runs on main and
# develop are never cancelled: each one publishes the artifacts of its commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# How this workflow is put together:
#
# - Every job checks out the same commit: on a pull request, GitHub's merge of
#   the branch into its base. The engine, the Rust module and the tests that
#   use them always come from one tree.
# - Tests run through the `just` recipes developers and agents run locally
#   (see justfile); the workflow adds only artifacts, caches and reporting.
# - Jobs install nothing from apt at run time. Tools come from pinned release
#   binaries (scripts/install-tools.sh), lockfiles, or the dependency image.
# - `ci` at the end is the one status check to require on a branch. Coverage
#   is reported next to it and never blocks a merge or a publish.

jobs:
  # A pull request that only touches prose skips the suites. Everything else,
  # and every push to main or develop, runs them all.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads the pull request's file list and nothing else.
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A renamed file counts under both names: moving code onto the
          # prose list is still a code change.
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          if [ -z "$files" ]; then
            echo "ERROR: GitHub listed no changed files for pull request $PULL_REQUEST" >&2
            exit 1
          fi
          # Prose that no build, test or published page reads. Keep this list
          # short and exact: a file a test reads must not be on it
          # (docs/theory/content-map.md and the issue forms are read by
          # tests, so they count as code). The formatting of these files is
          # still checked (Frontend checks).
          prose='^(AGENTS\.md|CLAUDE\.md|CONTRIBUTING\.md|README\.md|DISCLAIMER\.md|THIRD-PARTY-LICENSES\.md|docs/theory/README\.md|\.claude/skills/.*|\.agents/.*|\.github/pull_request_template\.md|\.github/FUNDING\.yml)$'
          if printf '%s\n' "$files" | grep -qvE "$prose"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only prose changed: the build and test jobs are skipped."
          fi

  # The product version, from web/package.json — also checks that Cargo.toml and
  # CHANGELOG.md agree with it, so a half-done release PR fails here.
  version:
    name: Release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "version=$(bash scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup reads the version, components and targets from
      # rust-toolchain.toml; nothing here names a toolchain.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install || rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-rust

      - name: Install just and wasm-bindgen (pinned)
        run: bash scripts/install-tools.sh

      - name: Format and Clippy
        run: just check-rust

      - name: Tests
        run: just test-rust

      - name: Build the Rust finite-element module for the browser
        run: bash scripts/build-fem-wasm.sh

      # The web jobs download this instead of installing Rust themselves.
      - name: Upload the Rust finite-element module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kofem-fem-pkg
          retention-days: 7
          path: web/src/wasm/fem/

  cpp-native:
    name: C++ tests (native)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CXX: g++

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just (pinned)
        run: bash scripts/install-tools.sh

      - name: C++ tests, host compiler
        run: just test-cpp-native

  # These programs link the precompiled MFEM WASM library, so they need em++
  # and node from the dependency image. Run independently of the engine build:
  # a cached or published engine must never bypass numerical regression tests.
  cpp-wasm:
    name: C++ tests (MFEM/WASM)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/mkofler96/kofem-dependencies:0.0.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just (pinned)
        run: bash scripts/install-tools.sh

      - name: C++ tests, Emscripten with MFEM
        run: just test-cpp-wasm

  # In the dependency image, which already holds the Emscripten sysroot and
  # the engine's libraries. clang-tidy >= 20 is required to parse the emsdk
  # clang-22-era headers; the PyPI wheel is the one scripts/docker-clang-tidy.sh
  # uses for the pre-commit hook.
  clang-tidy:
    name: C++ clang-tidy
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/mkofler96/kofem-dependencies:0.0.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just (pinned) and clang-tidy
        run: |
          bash scripts/install-tools.sh
          # The image ships pip and ninja. If a future image drops one, say so
          # and install it, rather than fail on a missing command.
          if ! python3 -m pip --version >/dev/null 2>&1 || ! command -v ninja >/dev/null; then
            echo "::warning::pip or ninja is missing from the dependency image; installing with apt"
            apt-get update && apt-get install -y --no-install-recommends python3-pip ninja-build
          fi
          python3 -m pip install --no-cache-dir clang-tidy==20.1.0

      - name: clang-tidy
        run: just check-cpp

  # The compiled engine is not committed (KOF-186) — it is published as the
  # release `engine-<id>` and pulled in by scripts/fetch-wasm-engine.sh. The ID is
  # a content hash of the engine sources, computed here on the runner rather than
  # in the `wasm` job: that job runs inside the dependency container, which may
  # have no git metadata to hash.
  engine-id:
    name: Engine build ID
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.compute.outputs.id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: compute
        run: |
          ID="$(bash scripts/engine-version.sh)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Engine build ID: $ID"

  wasm:
    name: WASM (Emscripten)
    needs: [engine-id]
    runs-on: ubuntu-24.04
    # A full engine build takes about 20 minutes.
    timeout-minutes: 45
    container:
      image: ghcr.io/mkofler96/kofem-dependencies:0.0.2

    env:
      KOFEM_ENGINE_ID: ${{ needs.engine-id.outputs.id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CMake stores absolute EMSDK paths in CMakeCache.txt and breaks across runs
      - name: Cache WASM build output
        id: wasm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/src/wasm/pkg/kofem_wasm_emcc.js
            web/src/wasm/pkg/kofem_wasm_emcc.wasm
            web/src/wasm/pkg/.engine-id
          key: wasm-${{ runner.os }}-${{ needs.engine-id.outputs.id }}

      # On a cache miss the engine may still have been built before — every push
      # to main publishes one. Downloading it beats a 20-minute rebuild, and it
      # exercises the exact path contributors use.
      - name: Try the published engine release
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-wasm-engine.sh --optional

      - name: Engine source status
        id: engine
        run: |
          if [ -s web/src/wasm/pkg/kofem_wasm_emcc.wasm ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Engine ${KOFEM_ENGINE_ID} obtained without building."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Engine ${KOFEM_ENGINE_ID} not published yet — full build will run."
          fi

      - name: Clean stale CMake cache
        if: steps.engine.outputs.have != 'true'
        run: |
          rm -f target/wasm-build/CMakeCache.txt
          rm -rf target/wasm-build/CMakeFiles

      - name: Build WASM engine
        if: steps.engine.outputs.have != 'true'
        run: bash scripts/build-wasm.sh

      # include-hidden-files carries the .engine-id stamp through to the jobs that
      # download this, so they can tell which sources the binary came from.
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kofem-wasm-pkg
          retention-days: 7
          include-hidden-files: true
          path: |
            web/src/wasm/pkg/kofem_wasm_emcc.js
            web/src/wasm/pkg/kofem_wasm_emcc.wasm
            web/src/wasm/pkg/.engine-id

  # Publish the engine so contributors, the Docker build and future CI runs can
  # download it instead of committing a ~34 MB blob per engine change (KOF-186).
  # Only from main and develop: a release is a public, immutable artifact, and PR
  # branches are served by the workflow artifact above. Releases are keyed by a
  # hash of the engine sources, so one published from develop is exactly the one
  # main would publish — main finds it and has nothing to do.
  publish-engine:
    name: Publish engine release
    needs: [engine-id, wasm, cpp-native, cpp-wasm]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: engine-dist/

      # Releases are content-addressed, so an existing tag already holds a binary
      # built from these exact sources — re-uploading would only churn it.
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.engine-id.outputs.id }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published — nothing to do."
            exit 0
          fi

          cd engine-dist
          sha256sum kofem_wasm_emcc.js kofem_wasm_emcc.wasm > SHA256SUMS

          # Marked as a prerelease so these build artifacts never take over the
          # "Latest release" banner from an actual product release.
          if gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WASM engine $TAG" \
            --prerelease \
            --notes "Compiled KoFEM WASM engine, built from \`engine/\` at ${GITHUB_SHA}.

          Installed automatically by \`scripts/fetch-wasm-engine.sh\`, which resolves this
          tag from the engine sources in your checkout — you should not need to download
          these files by hand." \
            kofem_wasm_emcc.js kofem_wasm_emcc.wasm SHA256SUMS; then
            exit 0
          fi

          # Two pushes carrying the same engine sources can race here. Losing the
          # race is fine — the winner published a binary built from those same
          # sources. Anything else is a real failure.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG was published concurrently — nothing to do."
            exit 0
          fi
          echo "ERROR: publishing $TAG failed and no release exists." >&2
          exit 1

  # --- Web frontend ---------------------------------------------------------
  # The web gates run as parallel jobs: the static checks, the node-side tests,
  # the browser tests split by project and shard, and the production-image
  # smoke test. An image is only published once every one of them has passed.
  #
  # These jobs take the engine and the Rust module from the `wasm` and `rust`
  # jobs' artifacts, so KOFEM_WASM_SKIP_FETCH=1 tells the package.json
  # pre-hooks not to fetch a release on top of them — a PR that changes
  # engine/ has no published release yet.

  # Runs on every pull request, prose-only ones included: prettier also owns
  # the repository's markdown.
  web-checks:
    name: Frontend checks
    needs: [changes, wasm, rust]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the web app (engine + Rust module artifacts, Bun, just)
        uses: ./.github/actions/setup-web
        with:
          wasm-artifacts: ${{ needs.changes.outputs.code }}

      - name: Format
        run: cd web && bun run format:check

      - name: Typecheck and lint
        if: needs.changes.outputs.code == 'true'
        run: |
          cd web
          bun run typecheck
          bun run lint

      - name: Build frontend
        if: needs.changes.outputs.code == 'true'
        run: cd web && bun run build

  # TypeScript logic and both WebAssembly modules without a browser: unit and
  # integration tests, the example checks and the Theory Guide's evidence.
  web-tests:
    name: Node-side tests
    needs: [wasm, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the web app (engine + Rust module artifacts, Bun, just)
        uses: ./.github/actions/setup-web

      - name: Node-side tests
        run: just test-web

  # The browser suite. Its two projects run in jobs of their own, so the
  # timing-sensitive interaction tests (`ui`) never share a machine with the
  # heavy STEP-to-result flows (`pipeline`); see web/playwright.config.ts.
  # A test that fails and then passes on retry is reported as flaky, with its
  # trace in the uploaded report, and does not fail the job.
  e2e:
    name: Browser tests (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: [wasm, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        project: [ui, pipeline]
        shard: [1, 2]

    env:
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the web app (engine + Rust module artifacts, Bun, just)
        uses: ./.github/actions/setup-web

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5

      - name: Browser tests
        run: just test-e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      # The HTML report with the trace of every retried test, and the raw
      # results. Kept for green runs too: a flaky test leaves the job green.
      # `overwrite`: a re-run of this job replaces the report of the attempt
      # before it instead of failing on the name.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/playwright-results/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  # Build the real production image and smoke-test it, in parallel with the
  # tests. The image is built map-free in main mode by web/Dockerfile.
  image:
    name: Docker image
    needs: [wasm, rust, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the web app (engine + Rust module artifacts, Bun, just)
        uses: ./.github/actions/setup-web

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the real production image, run it, and drive the full WASM pipeline
      # through the served artifacts. This catches production-only breakage (e.g.
      # a fingerprinted asset or the .wasm binary failing to resolve) that the
      # dev server and dist preview cannot. publish-image only runs once this
      # passed, and builds with the same inputs, so it pushes these layers from
      # the gha cache.
      - name: Smoke-test production image
        run: |
          VERSION=v${{ needs.version.outputs.version }}-$(git rev-parse --short HEAD)
          # Same stamp as publish-image, so its build is all cache hits.
          if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then VERSION="${VERSION/-/-dev-}"; fi
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --file ./web/Dockerfile \
            --build-context gallery=./examples/gallery/site \
            --build-arg VITE_GIT_VERSION=${VERSION} \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --tag kofem-web:smoke \
            ./web
          docker run -d --name kofem-smoke -p 10000:10000 kofem-web:smoke
          for i in $(seq 1 60); do
            curl -sf http://localhost:10000/ >/dev/null && break
            sleep 1
          done
          # A container that never came up fails here, with its log.
          curl -sf http://localhost:10000/ >/dev/null || { docker logs kofem-smoke; exit 1; }
          SMOKE_BASE_URL=http://localhost:10000 just test-e2e -c playwright.docker.config.ts

      # The same image as the dev deployment runs it (KOFEM_CHANNEL=dev): kept out
      # of search engines and marked, and an unknown channel refuses to start.
      - name: Smoke-test dev channel
        run: |
          docker run -d --name kofem-smoke-dev -e KOFEM_CHANNEL=dev -p 10001:10000 kofem-web:smoke
          for i in $(seq 1 60); do
            curl -sf http://localhost:10001/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:10001/robots.txt | grep -qx 'Disallow: /'
          curl -sf http://localhost:10001/app/ | grep -q '<meta name="kofem-channel" content="dev">'
          curl -sf http://localhost:10001/ | grep -q '<meta name="robots" content="noindex, nofollow">'
          set +e
          timeout 30 docker run --rm -e KOFEM_CHANNEL=prod kofem-web:smoke
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "ERROR: an unknown KOFEM_CHANNEL must stop the container (exit $status)" >&2
            exit 1
          fi

      - name: Tear down smoke container
        if: always()
        run: docker rm -f kofem-smoke kofem-smoke-dev || true

  # The one check to require before merging: green only when every gate above
  # passed (or was skipped because only prose changed). Coverage is not a gate.
  ci:
    name: ci
    needs:
      - changes
      - version
      - rust
      - cpp-native
      - cpp-wasm
      - clang-tidy
      - engine-id
      - wasm
      - web-checks
      - web-tests
      - e2e
      - image
    # Also when a gate failed, so the check reports red instead of pending. A
    # cancelled run was replaced by a newer one, which reports for itself.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "ERROR: these jobs did not pass:" $failed >&2
            exit 1
          fi
          # A skipped gate is only acceptable when the path filter skipped it.
          skipped="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "skipped") | .key')"
          if [ -n "$skipped" ] && [ "$CODE" != "false" ]; then
            echo "ERROR: these jobs were skipped although code changed:" $skipped >&2
            exit 1
          fi

  # Coverage of the browser suite, from an instrumented build run for that
  # purpose, reported to DeepSource. It is not a gate: the tests are judged by
  # the jobs above, on the build users get, and neither a flaky run here nor a
  # DeepSource outage may turn a pull request or a publish red. Dependency
  # updates carry no coverage report.
  coverage:
    name: Coverage
    needs: [wasm, rust]
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    # The whole suite in one job, on the slower instrumented build.
    timeout-minutes: 60
    continue-on-error: true
    env:
      KOFEM_WASM_SKIP_FETCH: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the web app (engine + Rust module artifacts, Bun, just)
        uses: ./.github/actions/setup-web

      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5

      # Whether the tests pass is not this job's question; the recipe reports
      # what they covered either way.
      - name: Browser tests on the instrumented build, and their coverage
        run: just coverage

      # A pinned release binary, checked against its published SHA-256. The
      # checkout is GitHub's merge commit, which DeepSource does not know, so
      # the report names the pull request's head commit.
      - name: Report coverage to DeepSource
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
          GHA_HEAD_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEEPSOURCE_CLI_VERSION: 0.10.2
          DEEPSOURCE_CLI_SHA256: 031efbf3326b26af63bbb962a093f4d532fa1a096aa9fd4b08095f2aa85042a8
        run: |
          # Empty on a push to main or develop, where HEAD is the commit itself.
          if [ -z "$GHA_HEAD_COMMIT_SHA" ]; then unset GHA_HEAD_COMMIT_SHA; fi
          archive="deepsource_${DEEPSOURCE_CLI_VERSION}_linux_x86_64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/DeepSourceCorp/cli/releases/download/v${DEEPSOURCE_CLI_VERSION}/$archive"
          echo "${DEEPSOURCE_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/deepsource"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/deepsource" deepsource
          sed 's|^SF:|SF:web/|' web/coverage/lcov.info > web/coverage/lcov.deepsource.info
          "$RUNNER_TEMP/deepsource/deepsource" report --analyzer test-coverage --key javascript \
            --value-file web/coverage/lcov.deepsource.info

  # Publish the image: main = :latest, develop = :dev; nothing for any other
  # branch or PR. Only after every gate passed on this commit, so a broken
  # commit never ships an image. The smoke test's build left its layers in the
  # gha cache, so this build is mostly cache hits.
  publish-image:
    name: Publish image
    runs-on: ubuntu-24.04
    needs: [version, ci]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      # Signed build provenance for pushed images (GitHub OIDC), so a deployment
      # can verify an image before running it.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-wasm-pkg
          path: web/src/wasm/pkg/

      # The Docker build's pre-hook needs the Rust module beside the engine,
      # exactly as in the `image` smoke test (via setup-web) that gated this.
      - name: Download the Rust finite-element module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kofem-fem-pkg
          path: web/src/wasm/fem/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/kofem-web"
          # The status bar shows this, so a bug report names the exact commit.
          VERSION=v${{ needs.version.outputs.version }}-$(git rev-parse --short HEAD)

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "main build: pushing :latest"
            PUSH_FLAG="--push"
            TAG_ARGS="--tag ${IMAGE}:latest --tag ${IMAGE}:${VERSION}"
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            VERSION="${VERSION/-/-dev-}"
            echo "develop build: pushing :dev"
            PUSH_FLAG="--push"
            TAG_ARGS="--tag ${IMAGE}:dev --tag ${IMAGE}:${VERSION}"
          else
            echo "ERROR: publish-image runs only for main and develop, not ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

          docker buildx build \
            --platform linux/amd64 \
            --file ./web/Dockerfile \
            --build-context gallery=./examples/gallery/site \
            --build-arg VITE_GIT_VERSION=${VERSION} \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            $TAG_ARGS \
            $PUSH_FLAG \
            ./web

          if [ -n "$PUSH_FLAG" ]; then
            DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
            case "$DIGEST" in
              sha256:*) echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT" ;;
              *) echo "ERROR: buildx reported no image digest ('$DIGEST')" >&2; exit 1 ;;
            esac
          fi

      # Signed provenance (SLSA, via GitHub OIDC) stored next to the image in
      # GHCR. A deployment that verifies it only runs images this workflow built
      # from this repository and branch — an image pushed to the registry any
      # other way fails the check:
      #   gh attestation verify oci://ghcr.io/mkofler96/kofem-web@<digest> \
      #     --repo mkofler96/KoFEM --signer-workflow mkofler96/KoFEM/.github/workflows/ci.yml \
      #     --source-ref refs/heads/develop --deny-self-hosted-runners
      - name: Attest web image provenance
        if: steps.image.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Tag and publish vX.Y.Z from the release commit: the merged release PR, which
  # is the maintainer's go/no-go. This job only runs after every gate passed on
  # that exact commit; scripts/publish-release.sh makes every other commit's run
  # a no-op, so a later push to main can never take the tag.
  release:
    name: Publish product release
    needs: [ci, publish-image, publish-engine]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the script finds the commit that added the version's
          # CHANGELOG.md heading.
          fetch-depth: 0

      - name: Publish release if this is the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
