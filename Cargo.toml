[workspace]
resolver = "2"
members = [
    "crates/kofem-core",
    "crates/kofem-geom",
    "crates/kofem-mesh",
    "crates/kofem-fem",
    "crates/kofem-shellize",
    "crates/kofem-wasm",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Michael Kofler"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
kofem-core = { path = "crates/kofem-core" }
kofem-mesh = { path = "crates/kofem-mesh" }
kofem-geom = { path = "crates/kofem-geom" }
kofem-fem = { path = "crates/kofem-fem" }
kofem-shellize = { path = "crates/kofem-shellize" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
# Exact pin: the wasm-bindgen CLI that generates the JS glue must be the same
# version (scripts/build-fem-wasm.sh checks it).
wasm-bindgen = "=0.2.129"

# Code-quality rules for the crates that opt in with `[lints] workspace = true`.
# They mirror web/'s ESLint rules (see CONTRIBUTING.md):
#   min_ident_chars                  ↔ kofem/min-identifier-length
#   allow_attributes_without_reason  ↔ "a disable comment needs a justification"
#   unwrap_used / expect_used        ↔ explicit errors instead of panics or fallbacks
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# The solver crate's tests run whole optimizations (SIMP loops of hundreds of
# solves); unoptimized they take minutes. Optimize this one crate in dev and
# test builds, keeping debug assertions and overflow checks.
[profile.dev.package.kofem-fem]
opt-level = 2

[profile.release]
opt-level = 3
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
