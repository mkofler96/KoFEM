# dev.kofem.org — the develop branch, deployed by deploy-dev.sh (see
# deploy/README.md). Copy this directory to the VPS next to the production
# compose file; do not run `docker compose up` here by hand: the image is the
# digest deploy-dev.sh verified, and without it compose refuses to start.
services:
  kofem-web-dev:
    image: ${KOFEM_DEV_IMAGE:?run deploy-dev.sh - it verifies the image and sets KOFEM_DEV_IMAGE}
    container_name: kofem-web-dev
    restart: unless-stopped
    environment:
      # noindex + DEV badge; no VITE_GA_ID, so dev traffic stays out of
      # analytics and no consent banner is shown.
      - KOFEM_CHANNEL=dev
    expose:
      - "10000"
    networks:
      - kofem-dev
    # Least privilege. nginx's master process starts as root, creates its cache
    # directories and drops its workers to the nginx user — CHOWN, SETUID and
    # SETGID are all it needs; the port (10000) needs no NET_BIND_SERVICE.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.5

networks:
  # A network of its own, shared only with the Cloudflare tunnel container —
  # not the network the dashboard and the production site live on, so a bad
  # dev image cannot reach them. Create it once and attach cloudflared to it:
  #   docker network create kofem-dev
  #   docker network connect kofem-dev <cloudflared container>
  kofem-dev:
    external: true
    name: kofem-dev
