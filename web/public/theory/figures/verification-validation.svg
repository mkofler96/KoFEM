<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="" viewBox="0 0 730 310" width="730" height="310">
<title>Verification and validation</title>
<desc>A chain from the physical system to a mathematical model, a discrete finite element model and its numerical solution. Verification compares the numerical solution with the mathematical model; validation compares it with the physical system.</desc>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400 600;src:url(data:font/woff2;base64,) format("woff2")}text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2933;} .small{font-size: 11px;} .lbl{fill: #5f6b7a;} .title{font-size: 14px; font-weight: 600;} .accent-text{fill: #1d5bbf;} .accent2-text{fill: #c4561f;} .ink{fill: none; stroke: #1f2933; stroke-width: 1.3;} .accent{fill: none; stroke: #1d5bbf; stroke-width: 2;} .accent2{fill: none; stroke: #c4561f; stroke-width: 2;}</style>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="a-ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></g></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f6b7a"/></marker><marker id="a-muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#5f6b7a"/></g></marker><marker id="a-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#c62828"/></g></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5bbf"/></marker><marker id="a-accent-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#1d5bbf"/></g></marker><marker id="a-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4561f"/></marker><marker id="a-accent2-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#c4561f"/></g></marker><marker id="a-accent3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-accent3-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></g></marker><marker id="a-accent4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b3fa0"/></marker><marker id="a-accent4-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#7b3fa0"/></g></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5f6b7a" stroke-width="1.2"/></pattern></defs>
<rect x="20" y="40" width="190" height="64" rx="8" style="fill:#eef4fa;stroke:#1f2933;stroke-width:1.4"/>
<text x="115" y="68" text-anchor="middle" class="title">Physical system</text>
<text x="115" y="88" text-anchor="middle" class="small lbl">the part, as it really is</text>
<rect x="270" y="40" width="190" height="64" rx="8" style="fill:#eef4fa;stroke:#1f2933;stroke-width:1.4"/>
<text x="365" y="68" text-anchor="middle" class="title">Mathematical model</text>
<text x="365" y="88" text-anchor="middle" class="small lbl">elasticity, loads, supports</text>
<rect x="520" y="40" width="190" height="64" rx="8" style="fill:#eef4fa;stroke:#1f2933;stroke-width:1.4"/>
<text x="615" y="68" text-anchor="middle" class="title">Discrete FE model</text>
<text x="615" y="88" text-anchor="middle" class="small lbl">mesh, elements, K d = f</text>
<rect x="520" y="190" width="190" height="64" rx="8" style="fill:#eef4fa;stroke:#1f2933;stroke-width:1.4"/>
<text x="615" y="218" text-anchor="middle" class="title">Numerical solution</text>
<text x="615" y="238" text-anchor="middle" class="small lbl">displacement, stress</text>
<line x1="210" y1="72" x2="268" y2="72" class="ink" marker-end="url(#a-ink)"/>
<text x="239" y="62" text-anchor="middle" class="small lbl">idealise</text>
<line x1="460" y1="72" x2="518" y2="72" class="ink" marker-end="url(#a-ink)"/>
<text x="489" y="62" text-anchor="middle" class="small lbl">discretise</text>
<line x1="615" y1="104" x2="615" y2="188" class="ink" marker-end="url(#a-ink)"/>
<text x="623" y="150" text-anchor="start" class="small lbl">solve</text>
<path d="M365 104C365 200 430 222 518 222" class="accent" marker-start="url(#a-accent-start)" marker-end="url(#a-accent)"/>
<text x="390" y="196" text-anchor="end" class="title accent-text">Verification</text>
<text x="390" y="214" text-anchor="end" class="small lbl">are the equations</text>
<text x="390" y="228" text-anchor="end" class="small lbl">solved correctly?</text>
<path d="M115 104C115 280 300 300 600 256" class="accent2" marker-start="url(#a-accent2-start)" marker-end="url(#a-accent2)"/>
<text x="150" y="270" text-anchor="start" class="title accent2-text">Validation</text>
<text x="150" y="288" text-anchor="start" class="small lbl">are they the right equations?</text>
</svg>
