<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="" viewBox="0 0 640 240" width="640" height="240">
<title>A bolt replaced by a coupling</title>
<desc>Left: two plates clamped by a bolt, with its head and washer on top, the shank through the hole and a nut below. Right: the upper plate alone with the bolt removed; a reference point on the bolt's axis is joined by legs to the ring of the top face under the head, and the bolt's force acts downward on the point.</desc>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400 600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2933;} .sym{font-family: "KoFEM Math", math; font-size: 17px;} .small{font-size: 11px;} .lbl{fill: #5f6b7a;} .title{font-size: 14px; font-weight: 600;} .load-text{fill: #c62828; font-weight: 700;} .body{fill: #dce8f4; stroke: #1f2933; stroke-width: 1.6; stroke-linejoin: round;} .side{fill: #c3d5e8; stroke: #1f2933; stroke-width: 1.2; stroke-linejoin: round;} .dim{fill: none; stroke: #5f6b7a; stroke-width: 1;} .load{fill: none; stroke: #c62828; stroke-width: 2;} .accent3{fill: none; stroke: #2e7d32; stroke-width: 2;} .node-accent{fill: #c4561f;}</style>
