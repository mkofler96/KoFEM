<text x="300" y="80" text-anchor="start" class="accent-text">shell mid-surface</text>
<text x="300" y="98" text-anchor="start" class="small lbl">(6 DOFs per node)</text>
<text x="300" y="182" class="sym load-text" style="font-weight:400">u<tspan dy="4" font-size="70%">S</tspan><tspan dy="-4"> = u</tspan><tspan dy="4" font-size="70%">A</tspan><tspan dy="-4"> + θ</tspan><tspan dy="4" font-size="70%">A</tspan><tspan dy="-4"> × r</tspan></text>
<text x="300" y="202" text-anchor="start" class="small lbl">rigid link to the shell edge</text>
<text x="220" y="218" text-anchor="end" class="small lbl">retained solid</text>
<text x="220" y="234" text-anchor="end" class="small lbl">section, 3t</text>
<text x="270" y="300" text-anchor="middle" class="lbl">solid block</text>
<text x="252" y="170" text-anchor="end" class="sym">A</text>
<text x="276" y="196" text-anchor="start" class="sym">S</text>
<line x1="248" y1="26" x2="272" y2="26" class="dim" marker-start="url(#a-muted)" marker-end="url(#a-muted)"/>
