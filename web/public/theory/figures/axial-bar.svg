<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="" viewBox="0 0 620 200" width="620" height="200">
<title>A bar in axial tension</title>
<desc>A straight bar of length L, Young's modulus E and cross-sectional area A, clamped at its left end and pulled to the right by a force P. Its free end moves by the extension delta.</desc>
<style>@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2933;} .sym{font-family: "KoFEM Math", math; font-size: 17px;} .load-text{fill: #c62828; font-weight: 700;} .accent-text{fill: #1d5bbf;} .body{fill: #dce8f4; stroke: #1f2933; stroke-width: 1.6; stroke-linejoin: round;} .dash{fill: none; stroke: #5f6b7a; stroke-width: 1; stroke-dasharray: 5 4;} .dim{fill: none; stroke: #5f6b7a; stroke-width: 1;} .load{fill: none; stroke: #c62828; stroke-width: 2;} .accent{fill: none; stroke: #1d5bbf; stroke-width: 2;} .hatch-fill{fill: url(#hatch); stroke: none;} .ground{fill: none; stroke: #1f2933; stroke-width: 1.6;}</style>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="a-ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></g></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f6b7a"/></marker><marker id="a-muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#5f6b7a"/></g></marker><marker id="a-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-load-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#c62828"/></g></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5bbf"/></marker><marker id="a-accent-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#1d5bbf"/></g></marker><marker id="a-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4561f"/></marker><marker id="a-accent2-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#c4561f"/></g></marker><marker id="a-accent3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-accent3-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></g></marker><marker id="a-accent4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b3fa0"/></marker><marker id="a-accent4-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><g transform="rotate(180 5 5)"><path d="M0 0L10 5L0 10z" fill="#7b3fa0"/></g></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5f6b7a" stroke-width="1.2"/></pattern></defs>
<rect x="64" y="40" width="16" height="100" class="hatch-fill"/><line x1="80" y1="40" x2="80" y2="140" class="ground"/>
<rect x="80" y="62" width="400" height="56" class="body"/>
<line x1="480" y1="90" x2="580" y2="90" class="load" marker-end="url(#a-load)"/>
<text x="540" y="78" text-anchor="middle" class="sym load-text" font-size="19">𝑃</text>
<line x1="80" y1="170" x2="480" y2="170" class="dim" marker-start="url(#a-muted-start)" marker-end="url(#a-muted)"/>
<line x1="80" y1="124" x2="80" y2="178" class="dim"/>
<line x1="480" y1="124" x2="480" y2="178" class="dim"/>
<text x="280" y="164" text-anchor="middle" class="sym">𝐿</text>
<text x="280" y="96" text-anchor="middle" class="sym">𝐸, 𝐴</text>
<line x1="480" y1="62" x2="480" y2="30" class="dim"/>
<line x1="524" y1="62" x2="524" y2="30" class="dash"/>
<path d="M480 40H524" class="accent" marker-end="url(#a-accent)"/>
<text x="532" y="44" text-anchor="start" class="sym accent-text" font-size="19">𝛿</text>
</svg>
