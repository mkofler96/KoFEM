<line x1="202.5" y1="40" x2="202.5" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="235" y1="40" x2="235" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="267.5" y1="40" x2="267.5" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="300" y1="40" x2="300" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="40" y1="40" x2="300" y2="40" class="load" style="stroke-width:1.4"/>
<text x="170" y="30" text-anchor="middle" class="small load-text">uniform traction q over length L</text>
<circle cx="40" cy="112" r="5" class="node"/>
<line x1="40" y1="122" x2="40" y2="182" class="load" marker-end="url(#a-load)"/>
<text x="40" y="202" text-anchor="middle" class="sym load-text" font-size="15">qL/2</text>
<circle cx="300" cy="112" r="5" class="node"/>
<line x1="300" y1="122" x2="300" y2="182" class="load" marker-end="url(#a-load)"/>
<text x="300" y="202" text-anchor="middle" class="sym load-text" font-size="15">qL/2</text>
<text x="170" y="262" text-anchor="middle" class="title">Linear edge: 2 nodes</text>
<line x1="380" y1="112" x2="640" y2="112" class="ink" style="stroke-width:3"/>
<line x1="380" y1="40" x2="380" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="412.5" y1="40" x2="412.5" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="445" y1="40" x2="445" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="477.5" y1="40" x2="477.5" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="510" y1="40" x2="510" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="542.5" y1="40" x2="542.5" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="575" y1="40" x2="575" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="607.5" y1="40" x2="607.5" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="640" y1="40" x2="640" y2="64" class="load" marker-end="url(#a-load)" style="stroke-width:1.4"/>
<line x1="380" y1="40" x2="640" y2="40" class="load" style="stroke-width:1.4"/>
<text x="510" y="30" text-anchor="middle" class="small load-text">uniform traction q over length L</text>
<circle cx="380" cy="112" r="5" class="node"/>
<line x1="380" y1="122" x2="380" y2="142" class="load" marker-end="url(#a-load)"/>
<text x="380" y="162" text-anchor="middle" class="sym load-text" font-size="15">qL/6</text>
<circle cx="510" cy="112" r="5" class="node"/>
<line x1="510" y1="122" x2="510" y2="202" class="load" marker-end="url(#a-load)"/>
<text x="510" y="222" text-anchor="middle" class="sym load-text" font-size="15">2qL/3</text>
<circle cx="640" cy="112" r="5" class="node"/>
<line x1="640" y1="122" x2="640" y2="142" class="load" marker-end="url(#a-load)"/>
<text x="640" y="162" text-anchor="middle" class="sym load-text" font-size="15">qL/6</text>
<text x="510" y="262" text-anchor="middle" class="title">Quadratic edge: 3 nodes</text>
</svg>
