<svg xmlns="http://www.w3.org/2000/svg" class="" viewBox="0 0 840 270" width="840" height="270">
<title>Gauss–Seidel removes oscillatory error but not smooth error</title>
<desc>Left: an error made of one smooth half-sine wave plus two fast oscillations. Right: after four Gauss–Seidel sweeps the oscillations have vanished, while the smooth half-sine is barely reduced.</desc>
