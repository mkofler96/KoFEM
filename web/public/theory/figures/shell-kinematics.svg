<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="" viewBox="0 0 640 330" width="640" height="330">
<title>A shell facet: mid-surface, local axes and six DOFs per node</title>
<desc>A thin plate of thickness t with a triangular facet on its mid-surface. Local axes e1, e2 and e3 start at the first node, e3 normal to the facet. At another node, red arrows show the three translations and orange double arrows the three rotations.</desc>
<style>@font-face{font-family:"KoFEM Math";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}text{font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2933;} .sym{font-family: "KoFEM Math", math; font-size: 17px;} .load-text{fill: #c62828; font-weight: 700;} .accent-text{fill: #1d5bbf;} .accent2-text{fill: #c4561f;} .body{fill: #dce8f4; stroke: #1f2933; stroke-width: 1.6; stroke-linejoin: round;} .body-alt{fill: #eef2f6; stroke: #1f2933; stroke-width: 1.4; stroke-linejoin: round;} .side{fill: #c3d5e8; stroke: #1f2933; stroke-width: 1.2; stroke-linejoin: round;} .dim{fill: none; stroke: #5f6b7a; stroke-width: 1;} .load{fill: none; stroke: #c62828; stroke-width: 2;} .accent{fill: none; stroke: #1d5bbf; stroke-width: 2;} .accent2{fill: none; stroke: #c4561f; stroke-width: 2;} .node{fill: #1f2933;}</style>
