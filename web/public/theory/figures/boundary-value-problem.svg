<svg xmlns="http://www.w3.org/2000/svg" class="" viewBox="0 0 700 340" width="700" height="340">
<title>A body with prescribed displacement, traction and body force</title>
<desc>A body Omega clamped on its left boundary Gamma D, where the displacement equals a prescribed value. Red traction arrows t act on the right boundary Gamma N. Orange arrows inside show the body force b, and a blue arrow shows the outward normal n.</desc>
