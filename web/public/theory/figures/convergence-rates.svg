<text x="72" y="124" text-anchor="end" class="small lbl">10⁻²</text>
<line x1="80" y1="30" x2="560" y2="30" class="grid"/>
<text x="72" y="34" text-anchor="end" class="small lbl">1</text>
<text x="80" y="318" text-anchor="middle" class="small lbl">10⁻²</text>
<text x="320" y="318" text-anchor="middle" class="small lbl">10⁻¹</text>
<text x="560" y="318" text-anchor="middle" class="small lbl">1</text>
<line x1="80" y1="300" x2="560" y2="300" class="axis"/>
<line x1="80" y1="30" x2="80" y2="300" class="axis"/>
<text x="320" y="342" text-anchor="middle" class="lbl">element size h (relative)</text>
<text x="28" y="165" text-anchor="middle" class="lbl" transform="rotate(-90 28 165)">error (relative)</text>
<polyline points="80,133.55 560,43.55" class="accent2"/>
<polyline points="80,237.09 560,57.09" class="accent"/>
<polyline points="80,300 560,71.44" class="accent3"/>
<polyline points="434.51,67.08 549.02,67.08 549.02,45.61" class="thin"/>
<text x="555.02" y="60.34" text-anchor="start" class="small">1</text>
<polyline points="320,147.09 434.51,147.09 434.51,104.15" class="thin"/>
<text x="440.51" y="129.62" text-anchor="start" class="small">2</text>
<polyline points="205.49,270.85 320,270.85 320,206.44" class="thin"/>
<text x="326" y="242.64" text-anchor="start" class="small">3</text>
<polyline points="80,40.08 560,67.08" class="" style="fill:none;stroke:#c62828;stroke-width:2;stroke-dasharray:6 4"/>
<line x1="90" y1="350" x2="120" y2="350" style="fill:none;stroke-width:2;stroke:#c4561f"/>
<text x="128" y="354" text-anchor="start" class="small">order 1: stress ∝ h</text>
<line x1="90" y1="370" x2="120" y2="370" style="fill:none;stroke-width:2;stroke:#1d5bbf"/>
<text x="128" y="374" text-anchor="start" class="small">order 1: displacement ∝ h², order 2: stress ∝ h²</text>
<line x1="90" y1="390" x2="120" y2="390" style="fill:none;stroke-width:2;stroke:#2e7d32"/>
<text x="128" y="394" text-anchor="start" class="small">order 2: displacement ∝ h³</text>
<line x1="90" y1="410" x2="120" y2="410" style="fill:none;stroke-width:2;stroke:#c62828;stroke-dasharray:6 4"/>
<text x="128" y="414" text-anchor="start" class="small">peak stress at a re-entrant corner: grows</text>
</svg>
