<text x="470" y="198" text-anchor="middle" class="bold">B: Uy, Uz</text>
<text x="207" y="119.5" text-anchor="start" class="bold">C: Uz</text>
<line x1="40" y1="245" x2="80" y2="245" class="ink" marker-end="url(#a-ink)"/>
<line x1="40" y1="245" x2="60" y2="227" class="ink" marker-end="url(#a-ink)"/>
