<line x1="492.5" y1="114.75" x2="582.5" y2="114.75" class="load" marker-end="url(#a-load)"/>
<text x="54" y="127" text-anchor="start" class="sym load-text">−𝑃</text>
<text x="572.5" y="104.75" text-anchor="start" class="sym load-text">𝑃</text>
<circle cx="150" cy="170" r="6" class="node-accent"/>
<circle cx="470" cy="170" r="6" class="node-accent"/>
<circle cx="195" cy="129.5" r="6" class="node-open"/>
