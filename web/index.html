<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/kofem_logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>
      Online Finite Element Solver — Browser-Based FEM Analysis | KoFEM
    </title>
    <meta
      name="description"
      content="KoFEM is a free online finite element solver that runs entirely in your browser. Import STEP geometry, apply loads and boundary conditions, and run a direct static solve — no installation required."
    />
    <link rel="canonical" href="https://kofem.org/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Online Finite Element Solver — KoFEM" />
    <meta
      property="og:description"
      content="Browser-based FEM analysis. Import STEP geometry and run a direct static solve in your browser. No installation required."
    />
    <meta property="og:url" content="https://kofem.org/" />
    <meta property="og:image" content="https://kofem.org/kofem_logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Online Finite Element Solver — KoFEM" />
    <meta
      name="twitter:description"
      content="Browser-based FEM analysis. Import STEP geometry and run a direct static solve in your browser. No installation required."
    />
    <meta name="twitter:image" content="https://kofem.org/kofem_logo.svg" />

    <!-- Self-hosted fonts (SIL OFL) — see public/fonts/README.md -->
    <link href="/fonts/ibm-plex.css" rel="stylesheet" />

    <!-- Structured data for rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "KoFEM",
        "applicationCategory": "EngineeringApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Browser-based finite element solver for linear static structural simulations. Import STEP geometry and run analyses in your browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="stylesheet" href="/landing/landing.css" />
    <!-- landing.js imports these only after it has loaded itself -->
    <link rel="modulepreload" href="/landing/vendor/manim-web.browser.js" />
    <link rel="modulepreload" href="/landing/vendor/three.module.js" />
    <link rel="modulepreload" href="/landing/vendor/three.core.js" />
  </head>
  <body>
    <header class="navigation">
      <a class="wordmark" href="#top" aria-label="KoFEM home"
        >KoFEM<span class="brand-dot">.</span></a
      >
      <nav class="navigation-links" aria-label="Main navigation">
        <a href="/examples/">Examples</a>
        <details class="navigation-more">
          <summary>More</summary>
          <div>
            <a href="/validation/">Validation</a
            ><a href="/privacy/">Privacy</a
            ><a href="#cookie-settings" id="kofem-cookie-settings"
              >Cookie settings</a
            >
          </div>
        </details>
        <a
          class="github"
          href="https://github.com/mkofler96/KoFEM"
          target="_blank"
          rel="noopener"
          aria-label="KoFEM on GitHub"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.71-4.04-1.58-4.04-1.58-.55-1.37-1.34-1.74-1.34-1.74-1.08-.72.08-.71.08-.71 1.2.08 1.83 1.21 1.83 1.21 1.07 1.79 2.81 1.27 3.5.97.11-.76.42-1.27.76-1.56-2.67-.3-5.47-1.3-5.47-5.78 0-1.28.47-2.32 1.24-3.14-.12-.3-.54-1.52.12-3.16 0 0 1.01-.32 3.3 1.2a11.6 11.6 0 0 1 6 0c2.29-1.52 3.3-1.2 3.3-1.2.66 1.64.24 2.86.12 3.16.77.82 1.24 1.86 1.24 3.14 0 4.49-2.81 5.47-5.49 5.76.43.36.81 1.08.81 2.18 0 1.58-.01 2.85-.01 3.24 0 .31.22.68.83.56A12.02 12.02 0 0 0 24 12.29C24 5.78 18.63.5 12 .5z"
            ></path></svg
        ></a>
        <a class="launch" href="/app/"
          >Start Solver <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    <main
      id="scroll-viewport"
      class="scroll-viewport"
      tabindex="0"
      aria-label="Scroll to explore geometry, meshing, loads, results and optimization"
    >
      <section
        id="top"
        class="scroll-story"
        aria-label="Bracket animation scroll range"
      >
        <div class="scroll-target" id="mesh-view" aria-hidden="true"></div>
      </section>
    </main>
    <div class="stage">
      <div class="ambient" aria-hidden="true"></div>
      <div class="intro">
        <div class="intro-brand">
          <img
            class="logo"
            src="/landing/kofem-logo.svg"
            alt=""
            width="112"
            height="112"
          />
          <h1>KoFEM</h1>
        </div>
        <p>Finite element analysis in your browser.</p>
      </div>
      <div class="mesh-copy" aria-hidden="true">
        <h2>Automatic Meshing</h2>
        <p class="stage-subtitle">Netgen automatic mesh generation</p>
      </div>
      <div class="analysis-copy" aria-hidden="true">
        <h2 id="analysis-title">Local Solve</h2>
        <p class="stage-subtitle" id="analysis-detail">
          No cloud, full control over your data.
        </p>
      </div>
      <div class="model-wrap">
        <div
          id="scene"
          role="img"
          aria-label="KoFEM workflow: geometry, mesh, loads, results and topology optimization."
        ></div>
        <p class="load-status" id="load-status" role="status">
          Loading the bracket…
        </p>
      </div>
      <div class="bottom-line">
        <a class="scroll-cue" href="#mesh-view"
          ><span class="scroll-icon" aria-hidden="true">↓</span
          ><span>Scroll</span></a
        >
      </div>
      <div class="progress" aria-hidden="true"><i></i></div>
    </div>
    <script type="module" src="/landing/landing.js"></script>
  </body>
</html>
