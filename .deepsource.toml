version = 1

# Generated artifacts — not hand-written code.  Excluding them keeps analyzers
# from grading generated output and stops the Prettier autofix from expanding
# the minified Emscripten glue (kofem_wasm_emcc.js) into thousands of lines.
exclude_patterns = [
  "web/src/wasm/pkg/**",
  "web/dist/**",
  # CLI demo/validation scripts: terminal output and process.exit ARE the
  # product here, so the JS analyzer's antipattern checks don't apply.
  "examples/**",
]

[[analyzers]]
name = "test-coverage"
enabled = true

[[analyzers]]
name = "rust"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]

[[analyzers]]
name = "cxx"
enabled = true

[[code_formatters]]
name = "rustfmt"
enabled = true

# No prettier formatter: DeepSource's bundled Prettier disagrees with the
# lockfile-pinned version the pre-commit hook and Frontend CI enforce, so the
# autofix bot and CI reformatted the same lines in opposite directions in an
# endless loop (see PR #348). Formatting is already gated locally and in CI.
